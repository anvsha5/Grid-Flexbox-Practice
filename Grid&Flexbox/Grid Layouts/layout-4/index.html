<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="background-color: greenyellow;" class="sidebar"></div>
        <div class="right-top">
            <div style="background-color:darkmagenta;" class="ra"></div>
            <div style="background-color:darkblue;" class="rb"></div>
        </div>
        <div class="right-bott">
            <div style="background-color:cadetblue;" class="bott1"></div>
            <div style="background-color:khaki;" class="bott2"></div>
            <div class="bott3">
                <div style="background-color:cornflowerblue;" class="s1"></div>
                <div style="background-color:darkgreen;" class="s2"></div>
                <div style="background-color:coral;" class="s3"></div>
            </div>
            <div style="background-color:deepskyblue;" class="bott4"></div>
        </div>
    </div>
</body>
</html>

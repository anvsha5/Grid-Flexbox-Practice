<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="background-color:cadetblue;" class="box1"></div>
        <div style="background-color:blueviolet;"class="box2"></div>
        <div class="box3">
            <div style="background-color:coral;" class="b1"></div>
            <div style="background-color:darkcyan;" class="b2"></div>
            <div style="background-color:darkorchid;" class="b3"></div>
        </div>
        <div class="box4">
            <div style="background-color:cornflowerblue;" class="s1"></div>
            <div style="background-color:darkblue;" class="s2"></div>
            <div style="background-color:fuchsia;" class="s3"></div>
            <div style="background-color:darksalmon;" class="s4"></div>
        </div>
        <div class="box5">
            <div style="background-color:darkolivegreen;" class="r1"></div>
            <div style="background-color:goldenrod;" class="r2"></div>
        </div>
        <div class="box6">
            <div style="background-color:darkred;" class="x1"></div>
            <div style="background-color:greenyellow;" class="x2"></div>
        </div>
    </div>
</body>
</html>
